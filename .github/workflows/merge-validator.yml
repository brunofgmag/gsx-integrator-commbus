name: Merge Validator

on:
  pull_request:
    branches: [ develop ]
    paths-ignore:
      - '.github/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-validator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: brunofgmag/gsx-integrator-ci/.github/workflows/merge-validator.yml@main
    with:
      runs-on: windows-latest
      install-qt: false
      run-tests: false
      no-sim: true
      sdk-env-var: MSFS2024_SDK
      # The WASM toolchain and the package tool build the module; the EFB sample
      # carries the efb_api and the vendored msfs-sdk the EFB app is built against.
      sdk-required-paths: |
        WASM/llvm/bin/clang++.exe
        WASM/wasi-sysroot
        Tools/bin/fspackagetool.exe
        Samples/DevmodeProjects/EFB/PackageSources/efb_api
        Samples/DevmodeProjects/EFB/PackageSources/vendor
    secrets: inherit
